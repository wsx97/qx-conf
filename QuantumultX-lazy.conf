# ==============================================================================
#  Quantumult X 懒人配置  v1.0
#  生成时间: 2026-11-02
#  设计思路: 分流拦截(域名/IP) + 重写净化(App 接口) 双层去广告
#            + 国内直连 + 自动测速选节点
#  唯一必改: [server_remote] 里的订阅地址
#  语法依据: 官方 sample.conf (crossutility/Quantumult-X)
# ==============================================================================


[general]
network_check_url = http://www.baidu.com
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
; 以下域名不做 198.18.x.x 占位 IP 映射，避免微信 / 运营商类 App 异常
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.weixin.qq.com, *.qq.com
; 压掉 QUIC / UDP 广告流量可打开下一行，但可能影响部分视频 App 首帧速度
;udp_drop_list = 1900, 80, STUN, QUIC


[dns]
server = 223.5.5.5
server = 119.29.29.29
; 纯 IPv4 更稳，需要原生 IPv6 就把下面这行的分号去掉
;no-ipv6
;doh-server = https://dns.alidns.com/dns-query


[policy]
; 手动选节点：QX 首页点「节点选择」即可挑具体线路
static = 节点选择, server-tag-regex=.*
; 自动测速：600 秒重测，100ms 容差内不切换，防抖动
url-latency-benchmark = 自动选择, server-tag-regex=.*, check-interval=600, tolerance=100, alive-checking=false
; 说明：这里不建「直连 / 拒绝」策略组，filter 里直接写 direct / reject 更省事也更不容易报错


[server_remote]
; ↓↓↓↓↓↓↓↓ 唯一必改的一行：换成你自己的订阅链接 ↓↓↓↓↓↓↓↓
; https://替换成你的订阅地址, tag=订阅, update-interval=86400, enabled=true


[filter_remote]
; ① 分流层去广告：域名 / IP 级拦截（实测 291,159 条，作者约 3 天更新一次）
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Advertising/Advertising.list, tag=Advertising, force-policy=reject, update-interval=86400, enabled=true
;
; ★ 如果 QX 启动明显变慢（29 万条要解析），注释掉上面那行，改用下面这条精简版：
;   合并去重后仅 315KB，每 8 小时更新
; https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockqxlite.conf, tag=AdLite, force-policy=reject, update-interval=28800, enabled=true


[filter_local]
; 局域网直连
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 127.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 224.0.0.0/24, direct
; 想让「全部流量」都走代理，把下面 geoip 这行删掉
geoip, cn, direct
final, 节点选择


[rewrite_remote]
; ② 重写层去广告：处理 App 内部广告接口（需安装 MitM 证书，见文末步骤）
; 每个文件自带 hostname 声明，QX 会自动合并，不用你手填域名
;
; ---- 已启用：8 个高频模块（体积小、误伤低）----
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/Applet.conf, tag=微信小程序净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/WeiboAds.conf, tag=微博净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/NeteaseAds.conf, tag=网易云净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/TieBaAds.conf, tag=贴吧净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/AmapAds.conf, tag=高德净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/GoofishAds.conf, tag=闲鱼净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf, tag=油管净化, update-interval=86400, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/BingSimplify.conf, tag=Bing简化, update-interval=86400, enabled=true
;
; ---- 备用：按需删掉行首分号即可启用 ----
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/CaiYunAds.conf, tag=彩云天气, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/CainiaoAds.conf, tag=菜鸟裹裹, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/MoJiWeatherAds.conf, tag=墨迹天气, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/Ximalaya.conf, tag=喜马拉雅, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/XiaoYuZhouAds.conf, tag=小宇宙, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/KeepAds.conf, tag=Keep, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/SmzdmAds.conf, tag=什么值得买, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/RedditAds.conf, tag=Reddit, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/NeteaseMailAds.conf, tag=网易邮箱, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/QiShuiMusicAds.conf, tag=汽水音乐, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/CheLaiLeAds.conf, tag=车来了, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/TaoPiaoPiaoAds.conf, tag=淘票票, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/ChinaUnicomAds.conf, tag=中国联通, update-interval=86400, enabled=true
; https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/BiliBiliComicsAds.conf, tag=B漫, update-interval=86400, enabled=true


[rewrite_local]
; 本地手写规则放这里（可选）。语法示例：
; ^https?:\/\/api\.example\.com\/v1\/ad url reject-dict
; ^https?:\/\/api\.example\.com\/v1\/feed url script-response-body https://example.com/feed.js


[mitm]
; 远程重写模块自带 hostname，通常这里不需要填。
; 只有你自己在 [rewrite_local] 加了规则时，才需要把对应域名补到下面：
; hostname = api.example.com, *.example.net
; skip_validating_cert = false


# ==============================================================================
#  使用步骤
#  1) 改 [server_remote] 的订阅地址 → QX 里「配置文件」导入本文件
#  2) 设置 → MitM → 生成并安装证书 → 去 iOS「设置-通用-关于本机-证书信任设置」
#     打开对该证书的完全信任。不做这步，[rewrite_remote] 里 8 个模块全部无效。
#  3) 首页把策略切到「自动选择」，开关打开，刷新一下订阅
#
#  误伤某个 App 时（该 App 打不开 / 图片加载不出），在 [filter_local] 的
#  geoip 行「上面」加一行放行：
#      host-suffix, 出问题的域名, direct
#
#  未包含：iOS 系统更新屏蔽、App 会员解锁（版权与稳定性风险高，需要单独确认）
# ==============================================================================
