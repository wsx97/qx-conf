[rewrite_remote]
; 油管去 Shorts（Surge 模块，需 opt-parser）
https://ghproxy.net/https://raw.githubusercontent.com/Aioneas/Surge/main/Module/youtube.aioneas.hide-shorts.sgmodule, tag=油管去Shorts, update-interval=172800, opt-parser=true, enabled=true
; 神机去广告（Surge 模块，需 opt-parser）
; 已停用：111 个 MITM 域名里 98 个（88.3%）已被黑猫声明，113 条规则里 83 条重复；
; 且该仓库 2023-11 起停止更新。留行备查。
; https://ghproxy.net/https://raw.githubusercontent.com/ConnersHua/RuleGo/master/Surge/Module/Block/Advertising.sgmodule, tag=神机去广告, update-interval=172800, opt-parser=true, enabled=true
; 贴吧去广告（QX 原生格式，不需要 opt-parser）
https://ghproxy.net/https://raw.githubusercontent.com/app2smile/rules/master/module/tieba-qx.conf, tag=贴吧去广告, update-interval=172800, enabled=true
;
; 墨鱼去开屏（QX 原生格式：1 行 hostname 含 437 个域名、504 条规则，不需要 opt-parser）
; 注意：这个地址会按请求头做内容协商——用浏览器打开会被重定向到首页，看起来像死链；
;       QX 以 text/plain 请求才能拿到配置。别用浏览器点开来判断它是否有效。
; 与黑猫重写重叠 270 条规则（56.4%）、293 个域名（67.0%）——重复声明在 QX 里会归一，不会重复解密；
; 它独有的 209 条规则 / 144 个域名主要是 App 开屏接口（/splash、flash/screen 之类），这是保留它的理由。
https://ddgksf2013.top/rewrite/StartUpAds.conf, tag=墨鱼去开屏, update-interval=172800, enabled=true
;
; ---- 来源 ②：blackmatrix7/ios_rule_script · rewrite/QuantumultX/Advertising ----
; App 内广告接口重写，实测 751 条规则（reject / reject-200 / reject-dict / reject-img）+ 582 个 MITM 域名
; QX 原生格式，不需要 opt-parser；文件头标注更新于 2025-08-26
; ⚠️ 它和墨鱼去开屏都会扩大 MitM 范围，两个都开时 MitM 域名合计超过 1000 个
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.conf, tag=黑猫去广告, update-interval=172800, enabled=true


