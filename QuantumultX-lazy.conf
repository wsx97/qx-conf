[mitm]
; Surge 模块自带 hostname 声明，由解析器合并；这里放补充声明。
;
; 番茄小说 .qxrewrite 自带的 hostname 行有 5 条在 QX 里无效：
;   *.pangolin-sdk-toutiao（少了 .com）、*.pstatp.com.* 、*.pglstatp-toutiao.com.* 、
;   gurd.snssdk.com.* 、*.pangolin-sdk-toutiao.*（双通配不成立），
; 并且漏了 *.byteimg.com 与 *.snssdk.com —— 而规则里确实有打到这两个域名的条目。
; 下面是按它 16 条规则的实际匹配对象重新推出来的 8 个域名：
hostname = *.pangolin-sdk-toutiao.com, *.pglstatp-toutiao.com, *.pstatp.com, gurd.snssdk.com, *.byteimg.com, *.snssdk.com, adim.pinduoduo.com, *.fqnovelvod.com
;
; 模板里开着 skip_validating_cert = true（关闭证书校验），本配置不采纳。
; 你自己在 [rewrite_local] 里加规则时，把对应域名补到上面那行末尾即可。
