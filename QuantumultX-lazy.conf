# ==============================================================================
#  Quantumult X 配置（去广告向）  基于 Orz-3 的模板重建
#  模板来源: https://github.com/Orz-3/QuantumultX
#  重建时间: 2026-11-02
#  与模板的差异都写在各自注释里，主要是：修掉一条失效地址、去掉一条关闭证书校验的选项、
#  以及给所有远程地址加了国内可直连的镜像前缀
