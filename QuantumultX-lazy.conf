[rewrite_local]
; 本地手写规则放这里（可选）。语法示例：
; ^https?:\/\/api\.example\.com\/v1\/ad url reject-dict
; ^https?:\/\/api\.example\.com\/v1\/feed url script-response-body https://example.com/feed.js


[mitm]
; 远程重写模块自带 hostname，通常这里不需要填。
; 只有你自己在 [rewrite_local] 加了规则时，才需要把对应域名补到下面：
; hostname = api.example.com, *.example.net
; skip_validating_cert = false


# ==============================================================================
#  使用步骤
#  1) 改 [server_remote] 的订阅地址 → QX 里「配置文件」导入本文件
#  2) 设置 → MitM → 生成并安装证书 → 去 iOS「设置-通用-关于本机-证书信任设置」
#     打开对该证书的完全信任。不做这步，[rewrite_remote] 里 8 个模块全部无效。
#  3) 首页把策略切到「自动选择」，开关打开，刷新一下订阅
#
#  误伤某个 App 时（该 App 打不开 / 图片加载不出），在 [filter_local] 的
#  geoip 行「上面」加一行放行：
#      host-suffix, 出问题的域名, direct
#
#  未包含：iOS 系统更新屏蔽、App 会员解锁（版权与稳定性风险高，需要单独确认）
# ==============================================================================
