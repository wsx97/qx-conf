# ==============================================================================
#  Quantumult X 配置 · 极致精简版 (lite)
#  与同目录的 QuantumultX-lazy.conf 是两份独立配置，各自单独导入，互不依赖。
#  设计取舍：只保留「砍掉就会功能失效」的列表，砍掉「砍掉只是变慢」的列表。
#  规模：filter 8 条 / 约 10,700 条规则、rewrite 2 条、策略组 4 个、零解析器依赖。
#  来源与取舍记录见 README。
# ==============================================================================

[general]
; lite 版没有 opt-parser 依赖，所以不配置 resource_parser_url（这是启动耗时与失败点）
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://cp.cloudflare.com/generate_204
; 以下域名不做 198.18.x.x 占位 IP 映射，避免微信 / 银行 / 运营商类 App 异常
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
; 丢掉 443 的 UDP（QUIC）：不少视频 App 的广告走 QUIC，退回 TCP 后重写才有机会命中。
; 代价是首帧变慢，个别站点可能异常；觉得卡就把这行注释掉。
udp_drop_list = 443
fallback_udp_policy = reject
excluded_routes = 239.255.255.250/32
icmp_auto_reply = true
; 显示节点归属地（可选，会向 ip-api.com 查询你的出口 IP）：
;geo_location_checker = http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/Orz-3/Orz-3/master/QuantumultX/IP.js

[dns]
; lite：只留 3 条 IPv4 上游 + 污染防护；IPv6 上游与 4 条域名定向上游已精简
server=119.29.29.29
server=180.184.1.1
server=223.5.5.5
circumvent-ipv4-answer = 127.0.0.1, 0.0.0.0, 61.160.148.90, 182.43.124.6, 124.236.16.201, 39.102.194.95, 106.74.25.198, 183.192.65.101, 36.135.17.248, 36.135.82.110, 39.105.1.17, 39.130.181.72, 39.130.181.73, 39.173.74.185, 47.92.198.202, 111.22.226.1, 111.28.0.32, 111.31.192.110, 111.44.246.131, 111.56.127.216, 111.63.132.170, 112.15.232.43, 112.17.14.211, 112.54.50.50, 117.156.25.11, 117.187.6.14, 117.187.10.42, 120.202.17.103, 120.204.204.201, 120.209.204.204, 120.222.19.204, 121.4.135.105, 183.203.36.19, 183.203.36.36, 183.207.72.18, 183.213.92.2, 183.220.145.129, 183.252.183.9, 211.137.54.227, 211.137.117.149, 211.137.133.69, 211.138.218.190, 211.139.25.61, 211.139.145.129, 218.201.25.129, 218.201.25.130, 218.203.122.98, 221.130.39.3, 221.180.160.221
circumvent-ipv6-answer = ::

[policy]
; lite：只留 4 个组（顺序：先 available，后 static，避免前向引用）
; 香港：final 的第一出口
available=香港节点, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台|本|坡|美)).)*$, img-url=https://ghproxy.net/https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
; 日本：黑白名单的第二出口
available=日本节点, server-tag-regex=(?=.*(本|JP|(?i)Japan))^((?!(港|台|坡|美)).)*$, img-url=https://ghproxy.net/https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
; 美国：AI 与 TikTok 的强制出口（砍掉会让 ChatGPT 报“地区不支持”）
available=美国节点, server-tag-regex=(?=.*(美|\bUS\b|(?i)States|American))^((?!(港|台|本|坡)).)*$, img-url=https://ghproxy.net/https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
; 美国出口：把 available 组包一层 static，才有「首项不可用就轮下一个」的兜底语义
; （available 组无成员列表，无法声明 fallback；只有 static 可以）
static=美国出口, 美国节点, proxy, direct
; 兜底：final 的唯一合法目标；组内带 proxy/direct，即使地区组全空也不会断网
static=黑白名单, 香港节点, 美国节点, 日本节点, proxy, direct, img-url=https://ghproxy.net/https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png

[server_remote]
; ↓↓↓ 换成你自己的订阅链接 ↓↓↓
; https://替换成你的订阅地址, tag=订阅, update-interval=86400, enabled=true


[filter_remote]
; lite：8 条。顺序 = 直连类在前、拒绝类在后，便于前面的直连表救回被广告表误收的域名
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Direct/Direct.list, tag=国内网站, force-policy=direct, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=苹果服务, force-policy=direct, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=AI-OpenAI, force-policy=美国出口, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Claude/Claude.list, tag=AI-Claude, force-policy=美国出口, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Gemini/Gemini.list, tag=AI-Gemini, force-policy=美国出口, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Copilot/Copilot.list, tag=AI-Copilot, force-policy=美国出口, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/TikTok/TikTok.list, tag=海外抖音, force-policy=美国出口, update-interval=604800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockqxlite.conf, tag=广告拦截, force-policy=reject, update-interval=28800, enabled=true
;
; ---- ④ 国内 IP 直连（替代已停用的 geoip, cn）----
; 同样排在所有 reject 表之后；精简版用 BGP 聚合版，体积小一个数量级（3,916 条 vs 19,619 条）。
; 文件内 UPDATED 2026-06-06。想要更全的覆盖可换成完整版那条 ChinaIPs。
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaIPsBGP/ChinaIPsBGP.list, tag=国内IP直连, force-policy=direct, update-interval=604800, enabled=true
;
; 相对完整版删掉的 8 条（都是“删了只是变慢”的）：
;   AdvertisingLite 38,066（占完整版规则 64%）、AWAvenue 665（唯一 opt-parser 依赖）、
;   Proxy 7,502、GlobalMedia 2,341、BiliBili 127、Telegram 40、WeChat 43、番茄小说 29

[rewrite_remote]
; lite：只留 2 个模块。墨鱼负责开屏类接口，黑猫负责 App 内广告接口。
; 再砍到 1 个不划算：墨鱼 437 个域名里 293 个已与黑猫重叠，砍掉它省不了多少解密面，
; 却会让开屏广告全灭。要么留这 2 个，要么整段清空（零 MITM，需另删 udp_drop_list）。
https://ddgksf2013.top/rewrite/StartUpAds.conf, tag=墨鱼去开屏, update-interval=172800, enabled=true
https://ghproxy.net/https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rewrite/QuantumultX/Advertising/Advertising.conf, tag=黑猫去广告, update-interval=172800, enabled=true
;
; 相对完整版删掉 3 条：番茄小说 .qxrewrite、字节系、小红书（均为单 App 专项，按需加回）

[server_local]
; 手动添加的单节点服务器写这里（示例）：
; shadowsocks=1.2.3.4:8388, method=aes-128-gcm, password=xxx, tag=HK-01, udp-relay=true
; 本配置的节点全部来自「服务器」页里你自己添加的订阅，所以这一段留空。
; 注意：这一段即使为空也必须存在——QX 导入远程配置时会校验段落完整性。


[filter_local]
; ---- 直连修正（原 ConnersHua Direct+ 的 21 条，搬到这里以摆脱解析器依赖）----
