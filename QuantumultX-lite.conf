; ⚠️ 已停用 geoip,cn：2026-11-04 实测确认 QX 是「本地规则优先于远程」，
;    而它是一条对所有国内 IP 通吃的兜底直连，会抢在所有远程 reject 广告表之前，
;    把解析到国内 IP 的广告域名判成 direct（国内广告漏拦）。
;    国内直连现由远程 Direct.list + 上面 21 条精确规则承担；个别国内长尾站会走 final（能通，略慢）。
;    需要恢复时去掉下一行行首的 "; " 即可。
; geoip, cn, direct
final, 黑白名单


[rewrite_local]
; 本地手写重写放这里，例如：
; ^https?:\/\/example\.com\/ad url reject-dict


[task_local]
; 流媒体解锁查询（可选，需 MitM）：
; event-interaction https://ghproxy.net/https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁查询, enabled=true


[http_backend]
; 本地 HTTP 服务 + JS 处理，一般用不到，留空即可（同样必须存在）。
; 示例：convert.js, tag=fileConverter, path=^/convert/v1/


[mitm]
; lite：两条远程 rewrite 自带 hostname 声明，QX 会自动合并，本节无需重复声明。
; 完整版这里曾有 8 个域名，是给番茄小说 .qxrewrite 补漏的；该模块未启用，故一并删除。
; 自己在 [rewrite_local] 里加规则时，把域名写到这里：
; hostname = *.example.com
